^Palettes:
	PaletteFromFile@terrain-temperat:
		Filename: alien.pal
	TintPostProcessEffect:
		Red: 1.3
		Green: 1
		Blue: 1.5
		Ambient: 0.5
	FixedColorPalette@BlueTiberium:
		Color: ffffff

^BaseWorld:
	TerrainLighting:
	ResourceRenderer:
		ResourceTypes:
			BlueTiberium:
				Name: Purified Tiberium

^BasePlayer:
	PlayerResources:
		ResourceValues:
			BlueTiberium: 25

World:
	LuaScript:
		Scripts: campaign.lua, reckoning.lua
	MissionData:
		Briefing: Map-Briefing
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: gateway

Player:
	PlayerResources:
		DefaultCash: 6000

# Purified Tib doesn't damage infantry

^Infantry:
	DamagedByTerrainCA@TIBDAMAGE:
		Terrain: Tiberium

TMPL:
	GrantExternalConditionPowerCA@Frenzy:
		-Prerequisites:

ACOL:
	Buildable:
		Prerequisites: obliortmpl, anyradar, ~infantry.nod, ~!tmpp

TPLR:
	Buildable:
		Prerequisites: obliortmpl, anyradar, ~infantry.nod, ~tmpp

BH:
	Buildable:
		Prerequisites: anyradar, ~infantry.nod

LTNK:
	Buildable:
		Prerequisites: ~vehicles.nod, ~!lastnk.upgrade

LTNK.Laser:
	Buildable:
		Prerequisites: ~vehicles.nod, ~lastnk.upgrade

MTNK:
	Buildable:
		Prerequisites: ~!bdrone.upgrade, ~vehicles.gdi

MTNK.Laser:
	Inherits@CAMPAIGNDISABLED: ^Disabled

FTNK:
	Buildable:
		Prerequisites: anyradar, ~vehicles.nod

HFTK:
	Buildable:
		Prerequisites: anyradar, ~vehicles.nod

WTNK:
	Buildable:
		Prerequisites: anyradar, ~vehicles.nod

MLRS:
	Buildable:
		Prerequisites: tmpl, ~vehicles.nod

SPEC:
	Buildable:
		Prerequisites: tmpl, ~vehicles.nod

VENM:
	Buildable:
		Prerequisites: ~aircraft.nod

APC2:
	Buildable:
		Prerequisites: ~vehicles.gdi, ~!vulcan.upgrade

AIRS:
	Inherits@CAMPAIGNDISABLED: ^Disabled

WEAP.TD:
	Buildable:
		Prerequisites: anyrefinery, ~structures.td

blacknapalm.upgrade:
	Buildable:
		Prerequisites: ~player.nod, tmpl

quantum.upgrade:
	Buildable:
		Prerequisites: ~player.nod, tmpl

hstk.upgrade:
	Buildable:
		Prerequisites: ~player.nod, tmpl

