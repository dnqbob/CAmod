^Palettes:
	TintPostProcessEffect:
		Red: 1
		Green: 1
		Blue: 1
		Ambient: 1

^BaseWorld:
	TerrainLighting:

World:
	LuaScript:
		Scripts: campaign.lua, trepidation.lua
	MissionData:
		Briefing: Map-Briefing
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: backstab

Player:
	PlayerResources:
		DefaultCash: 6000
	ProvidesPrerequisitesOnTimeline:
		PauseOnCondition: !spy-extracted
	ExternalCondition@SpyExtracted:
		Condition: spy-extracted

# Enable subfaction specific tech

SNIP:
	Buildable:
		Prerequisites: ~tent, anyradar

RTNK:
	Buildable:
		Prerequisites: ~vehicles.allies

TNKD:
	Buildable:
		Prerequisites: anyradar, ~vehicles.allies

CHPR:
	Buildable:
		Prerequisites: atek, ~vehicles.allies

BATF:
	Buildable:
		Prerequisites: atek, ~vehicles.allies

NHAW:
	Buildable:
		Prerequisites: ~aircraft.allies

HTUR:
	Buildable:
		Prerequisites: ~structures.allies, anyradar

entrench.upgrade:
	Buildable:
		Prerequisites: anyradar, ~radar.allies

apb.upgrade:
	Buildable:
		Prerequisites: atek

tflx.upgrade:
	Buildable:
		Prerequisites: pdox

# Misc

WORMHOLEXL:
	TerrainLightSource:
		Range: 3c0
		Intensity: 0.5
		RedTint: 1

SPY.NoInfil:
	Inherits: SPY
	RenderSprites:
		Image: spy
	-Buildable:
	-Infiltrates:
	-WithColoredSelectionBox@Disguised:
	-DisguiseTooltip:
	Tooltip:
		Name: Spy

JEEP:
	GrantTimedConditionOnDeploy@Optics:
		DeployedTicks: 375
		CooldownTicks: 250

ALHQ:
	FreeActor@Greece:
		Actor: greece.coalition

greece.coalition:
	Inherits@CAMPAIGNDISABLED: ^Disabled

sweden.coalition:
	Inherits@CAMPAIGNDISABLED: ^Disabled

korea.coalition:
	Inherits@CAMPAIGNDISABLED: ^Disabled

E7:
	-Demolition:

NUKC.Defender:
	Inherits: NUKC
	-Buildable:
	RenderSprites:
		Image: nukc
	AutoTarget:
		InitialStanceAI: Defend
