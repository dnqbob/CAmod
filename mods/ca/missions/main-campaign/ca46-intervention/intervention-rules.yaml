^Palettes:
	PaletteFromFile@terrain-temperat:
		Filename: ca|missions/main-campaign/ca46-intervention/summer.pal
	FlashPostProcessEffect@LIGHTNINGSTRIKE:
		Type: LightningStrike
	WeatherOverlay@RAIN:
		WindTick: 150, 550
		UseSquares: false
		ScatterDirection: 0, 0
		Gravity: 30, 35
		SwingOffset: 0, 0
		SwingSpeed: 0, 0
		SwingAmplitude: 0, 0
		ParticleColors: 72aaae, 72aea6, 5caea3, 6da69f
		LineTailAlphaValue: 30
		ParticleSize: 1, 1
		ParticleDensityFactor: 15
	TerrainLighting:
	TintPostProcessEffect:
		Red: 1.22
		Green: 1.27
		Blue: 1.15
		Ambient: 0.7

World:
	LuaScript:
		Scripts: campaign.lua, intervention.lua
	MissionData:
		Briefing: Map-Briefing
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: creep

Player:
	PlayerResources:
		DefaultCash: 6000

