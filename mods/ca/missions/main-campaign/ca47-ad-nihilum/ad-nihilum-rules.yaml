^Palettes:
	PaletteFromFile@terrain-temperat:
		Filename: ca|missions/main-campaign/ca47-ad-nihilum/dartmoor.pal
	TintPostProcessEffect:
		Red: 1
		Green: 1
		Blue: 1
		Ambient: 0.85

^BaseWorld:
	TerrainLighting:

World:
	LuaScript:
		Scripts: campaign.lua, ad-nihilum.lua
	MissionData:
		Briefing: Map-Briefing
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: malev

Player:
	PlayerResources:
		DefaultCash: 6000

# Enable subfaction specific tech

SNIP:
	Buildable:
		Prerequisites: ~tent, anyradar

RTNK:
	Buildable:
		Prerequisites: ~vehicles.allies

TNKD:
	Buildable:
		Prerequisites: anyradar, ~vehicles.allies

CHPR:
	Buildable:
		Prerequisites: atek, ~vehicles.allies

BATF:
	Buildable:
		Prerequisites: atek, ~vehicles.allies

NHAW:
	Buildable:
		Prerequisites: ~aircraft.allies

HTUR:
	Buildable:
		Prerequisites: ~structures.allies, anyradar

entrench.upgrade:
	Buildable:
		Prerequisites: anyradar, ~radar.allies

apb.upgrade:
	Buildable:
		Prerequisites: atek

tflx.upgrade:
	Buildable:
		Prerequisites: pdox

^VeilOfWarPower:
	SpawnActorPowerCA@VeilOfWar:
		Prerequisites: ~radar.allies

# Misc

STLK:
	Cloak@NORMAL:
		CloakDelay: 750
		RequiresCondition: !cloak-force-disabled && !being-warped && !parachute
	GrantTimedCondition@Uncloaked:
		RequiresCondition: !hidden
	DummyConditionConsumer@cloak-active:
		Condition: cloak-active
	DummyConditionConsumer@cloak-charging:
		Condition: cloak-charging

VENG:
	ExternalCondition@VengReveal:
		Condition: veng-reveal
	RevealsShroud@Reveal:
		Range: 5c0
		ValidRelationships: Enemy
		RequiresCondition: veng-reveal

# Hunt() requires only 1 AttackBase
DEVA:
	-AttackFrontalCharged:
	-Armament@PRIMARYUPG:
	-AmbientSound@CHARGE:
	-WithIdleOverlay@CHARGE1:
	-WithIdleOverlay@CHARGE2:
	-WithIdleOverlay@CHARGE3:
