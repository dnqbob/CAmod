^Palettes:
	PaletteFromFile@terrain-temperat:
		Filename: alien.pal
	TintPostProcessEffect:
		Red: 1.3
		Green: 1
		Blue: 1.5
		Ambient: 0.5

^BaseWorld:
	TerrainLighting:

World:
	LuaScript:
		Scripts: campaign.lua, foothold.lua
	MissionData:
		Briefing: Map-Briefing
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: whatlurk

Player:
	PlayerResources:
		DefaultCash: 6000

FLARE.sensor:
	Inherits: FLARE
	Tooltip:
		Name: Sensor Deployment Zone
	WithRangeCircle:
		Type: SensorZone
		Visible: Always
		Color: ead37740
		Range: 10c0
	RevealsShroud:
		Range: 1c512

deployedsensortoken:
	Inherits: ^InvisibleDummy
	Mobile:
		Locomotor: cloud
		Speed: 1
	KillsSelf:
		Delay: 26

MSAR:
	LaysMinefield@token:
		Mines: deployedsensortoken
		MineSelectionMode: Shuffled
		Locations: 0,0
		RecreationInterval: 25
		RequiresCondition: deployed

NERV:
	-Sellable:
	-SpawnActorsOnSellCA:
	-SpawnActorOnDeath:
	CaptureManager:
		-BeingCapturedCondition:
	Power:
		Amount: 0
	-DetonateWeaponPower@STORMSPIKE:

SILO.SCRIN:
	Power:
		Amount: 0

WORMHOLE:
	-Targetable:
	-RallyPoint:
	-Selectable:
	Interactable:
	Tooltip:
		Name: Unstable Wormhole

WORMHOLEXL:
	Tooltip:
		Name: Stabilized Wormhole
	TerrainLightSource:
		Range: 3c0
		Intensity: 0.5
		BlueTint: 1
		RedTint: 0.2

# Enable subfaction specific tech

XO:
	Buildable:
		Prerequisites: gtek, ~vehicles.gdi

WOLV:
	Buildable:
		Prerequisites: gtek, ~vehicles.gdi

PBUL:
	Buildable:
		Prerequisites: gtek, ~vehicles.gdi

STWR:
	Buildable:
		Prerequisites: vehicles.any, ~structures.gdi

ionmam.upgrade:
	Buildable:
		Prerequisites: upgc, !mdrone.upgrade, !hovermam.upgrade
	TooltipExtras:
		Attributes: \n(!) Only ONE Mammoth Tank upgrade can be chosen

hovermam.upgrade:
	Buildable:
		Prerequisites: upgc, !ionmam.upgrade, !mdrone.upgrade
	TooltipExtras:
		Attributes: \n(!) Only ONE Mammoth Tank upgrade can be chosen

mdrone.upgrade:
	Buildable:
		Prerequisites: upgc, !ionmam.upgrade, !hovermam.upgrade
	TooltipExtras:
		Attributes: \n(!) Only ONE Mammoth Tank upgrade can be chosen

# Disable tech

HQ:
	-DropPodsPowerCA@Zocom:
	-AirstrikePowerCA@uav:
	-AirstrikePowerCA@uavST:

AFLD.GDI:
	-InterceptorPower@AirDef:

EYE:
	Inherits@CAMPAIGNDISABLED: ^Disabled

upgc.drop:
	Inherits@CAMPAIGNDISABLED: ^Disabled

# Hunt() requires only 1 AttackBase
DEVA:
	-AttackFrontalCharged:
	-Armament@PRIMARYUPG:
	-AmbientSound@CHARGE:
	-WithIdleOverlay@CHARGE1:
	-WithIdleOverlay@CHARGE2:
	-WithIdleOverlay@CHARGE3:
