^Palettes:
	TintPostProcessEffect:
		Red: 1
		Green: 1
		Blue: 1
		Ambient: 1
	PaletteFromFile@terrain-temperat:
		Name: terrain
		Tileset: TEMPERAT
		Filename: ca|missions/main-campaign/ca43-dissection/basejungle.pal
		ShadowIndex: 3, 4

World:
	LuaScript:
		Scripts: campaign.lua, dissection.lua
	MissionData:
		Briefing: Map-Briefing
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: shut_it

Player:
	PlayerResources:
		DefaultCash: 6000

# Enable subfaction specific tech

SNIP:
	Buildable:
		Prerequisites: ~tent, anyradar

RTNK:
	Buildable:
		Prerequisites: ~vehicles.allies

TNKD:
	Buildable:
		Prerequisites: anyradar, ~vehicles.allies

CHPR:
	Buildable:
		Prerequisites: atek, ~vehicles.allies

BATF:
	Buildable:
		Prerequisites: atek, ~vehicles.allies

NHAW:
	Buildable:
		Prerequisites: ~aircraft.allies

HTUR:
	Buildable:
		Prerequisites: ~structures.allies, anyradar

entrench.upgrade:
	Buildable:
		Prerequisites: anyradar, ~radar.allies

apb.upgrade:
	Buildable:
		Prerequisites: atek

tflx.upgrade:
	Buildable:
		Prerequisites: pdox

# Disable powers for AI

^ParabombsPower:
	AirstrikePowerCA@Russianparabombs:
		Prerequisites: ~support.parabombs, ~!botplayer

^ParatroopersPower:
	ParatroopersPowerCA@paratroopers:
		Prerequisites: ~support.paratroopers, ~!botplayer

# Misc

DOME:
	ExternalCondition@PowerDown:
		Condition: powerdown

LST.MCV:
	Inherits: LST
	-Buildable:
	RenderSprites:
		Image: lst
	Cargo:
		InitialUnits: mcv, 2tnk, 2tnk, jeep, arty

ALHQ:
	FreeActor@Greece:
		Actor: greece.coalition

greece.coalition:
	Inherits@CAMPAIGNDISABLED: ^Disabled

sweden.coalition:
	Inherits@CAMPAIGNDISABLED: ^Disabled

korea.coalition:
	Inherits@CAMPAIGNDISABLED: ^Disabled

FLARE:
	RevealsShroud:
		Range: 8c0

GRAD.Defender:
	Inherits: GRAD
	-Buildable:
	RenderSprites:
		Image: grad
	AutoTarget:
		InitialStanceAI: Defend

BADR.Carpet:
	Inherits: BADR.CBomber
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	-AmmoPool:
	-AttackBomber:
	AttackAircraft:
		FacingTolerance: 512
		OpportunityFire: true
	Health:
		HP: 40000
	RevealsShroud:
		Range: 12c0
		Type: GroundPosition
	AutoTarget:
		InitialStanceAI: AttackAnything
		MinimumScanTimeInterval: 1
		MaximumScanTimeInterval: 2
	AmmoPool:
		Ammo: 10
		AmmoCondition: ammo
	Armament:
		PauseOnCondition: !ammo
