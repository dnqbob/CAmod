LQTF:
	Inherits: ^Building
	Inherits@SHAPE: ^2x2Shape
	RenderSprites:
		Image: bio
	Selectable:
		Bounds: 2048, 2048
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Tooltip:
		Name: Liquid Tiberium Processing Plant
	Health:
		HP: 150000
	Armor:
		Type: Wood
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	-Sellable:
	-SpawnActorsOnSellCA:
	-SpawnActorOnDeath:
	CaptureManager:
		-BeingCapturedCondition:
	AmmoPool@LIQUIDTIB:
		Ammo: 10
		InitialAmmo: 0
	WithAmmoPipsDecoration@LIQUIDTIB:
		PipCount: 10
		RequiresSelection: false
		Position: BottomLeft
		Margin: 4, 3
	FireWarheadsOnDeath:
		Weapon: UnitExplodeToxinTruck
		EmptyWeapon: UnitExplodeToxinTruck

TTRK:
	Inherits@SELECTION: ^SelectableSupportUnit
	Buildable:
		Prerequisites: vehicles.nod
		Description: Tanker for carrying liquid Tiberium
	Valued:
		Cost: 1000
	TooltipExtras:
		Weaknesses: • Very weak armor\n• Extremely volatile when full
		-Attributes:
	Tooltip:
		Name: Liquid Tiberium Tanker
	-KillsSelf:
	-AttackFrontal:
	-Armament@PRIMARY:
	-GrantConditionOnAttack:
	-GrantConditionOnDeploy:
	-VoiceAnnouncement:
	-ExternalCondition@PRODUCED:
	Voiced:
		VoiceSet: VehicleVoice
	Mobile:
		Speed: 49
		Voice: Action
	Passenger:
		Voice: Action
	AmmoPool@LIQUIDTIB:
		Ammo: 1
		InitialAmmo: 0
		AmmoCondition: ammo
	WithAmmoPipsDecoration@LIQUIDTIB:
		PipCount: 1
		RequiresSelection: false
		Position: BottomLeft
		Margin: 4, 3
	FireWarheadsOnDeath:
		RequiresCondition: ammo
	FireWarheadsOnDeath@EMPTY:
		Weapon: UnitExplodeSmall
		EmptyWeapon: UnitExplodeSmall
		RequiresCondition: !ammo
	MustBeDestroyed:
		RequiredForShortGame: true
	Targetable@TTRK:
		TargetTypes: TibTruck

NERV:
	DetonateWeaponPower@BUZZERSWARMAI:
		Prerequisites: nerv
		ChargeInterval: 7500
	DetonateWeaponPower@STORMSPIKE:
		Prerequisites: nerv
		ChargeInterval: 8250

# Hunt() requires only 1 AttackBase
DEVA:
	-AttackFrontalCharged:
	-Armament@PRIMARYUPG:
	-AmbientSound@CHARGE:
	-WithIdleOverlay@CHARGE1:
	-WithIdleOverlay@CHARGE2:
	-WithIdleOverlay@CHARGE3:

WORMHOLE:
	Inherits@INF: ^ProducesInfantry
	Inherits@VEH: ^ProducesVehicles
	-TeleportNetwork:
	Health:
		HP: 400000
	ChangesHealth:
		PercentageStep: 1
		Delay: 25
		StartIfBelow: 101
		DamageCooldown: 0
		RequiresCondition: !regen-disabled
	ExternalCondition@NOREGEN:
		Condition: regen-disabled
	ExternalCondition@FIX1:
		Condition: forceshield
	ExternalCondition@FIX2:
		Condition: being-warped
	MustBeDestroyed:
		RequiredForShortGame: true

# Removing TeleportNetwork from Wormhole above causes exception as no actors with TeleportNetwork are defined
dummyteleport:
	Inherits: ^InvisibleDummy
	TeleportNetwork:
		Type: Wormhole
