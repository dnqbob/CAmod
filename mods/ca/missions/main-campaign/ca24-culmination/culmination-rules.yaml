
^Palettes:
	TintPostProcessEffect:
		Red: 1
		Green: 1
		Blue: 1.2
		Ambient: 0.8
	PaletteFromFile@terrain-temperat:
		Filename: ca|missions/main-campaign/ca24-culmination/brown.pal
	FlashPostProcessEffect@Subjugation:
		Type: Subjugation
		Color: a400f2

World:
	LuaScript:
		Scripts: campaign.lua, culmination.lua
	MissionData:
		Briefing: Map-Briefing
	MapOptions:
		ShortGameCheckboxEnabled: False
	MusicPlaylist:
		StartingMusic: timebomb

Player:
	PlayerResources:
		DefaultCash: 6000

# Enable subfaction specific tech

STCR:
	Buildable:
		Prerequisites: anyradar, ~vehicles.scrin

LCHR:
	Buildable:
		Prerequisites: anyradar, ~vehicles.scrin

RUIN:
	Buildable:
		Prerequisites: scrt, ~vehicles.scrin

OBLT:
	Buildable:
		Prerequisites: scrt, ~vehicles.scrin

ATMZ:
	Buildable:
		Prerequisites: scrt, ~vehicles.scrin

ENRV:
	Buildable:
		Prerequisites: scrt, ~aircraft.scrin

stellar.upgrade:
	Buildable:
		Prerequisites: scrt

coalescence.upgrade:
	Buildable:
		Prerequisites: scrt

# Disable tech

RMBO:
	Inherits@CAMPAIGNDISABLED: ^Disabled

BORI:
	Inherits@CAMPAIGNDISABLED: ^Disabled

E7:
	Inherits@CAMPAIGNDISABLED: ^Disabled

MSHP:
	Inherits@CAMPAIGNDISABLED: ^Disabled

# Misc

WORMHOLE.Exit:
	Inherits: ^WormholeBase
	RenderSprites:
		Image: wormhole
	Immobile:
		OccupiesSpace: false
	Health:
		HP: 300000

MAST:
	GainsExperienceMultiplier@ThirdXp:
		Modifier: 33

PDGY:
	GrantExternalConditionPowerCA@Subjugation:
		OrderName: subjugation
		Icon: subjugation
		IconPalette: chromes
		ChargeInterval: 125
		ExplosionWeapon: SubjugationSpawner
		Name: Subjugation
		Condition: subjugated
		Range: 18c0
		MinTargets: 1
		ValidTargets: Infantry, Vehicle, Ship, Structure
		ValidRelationships: Enemy
		Duration: 25
		AllowMultiple: false
		Description: \nPermanently mind controls units and structures in target area.
		OnFireSound: mastermind-fire.aud
		SelectTargetSpeechNotification: SelectTarget
		SelectTargetTextNotification: Select target.
		InsufficientPowerSpeechNotification: InsufficientPower
		EndChargeSpeechNotification: SubjugationReady
		EndChargeTextNotification: Subjugation ready.
		DisplayRadarPing: True
		Cursor: mc-capture
		SupportPowerPaletteOrder: 0
		ShowTargetCircle: true
		ShowSelectionBoxes: true
		TargetTintColor: a400f233
		TargetCircleColor: a400f2cc
		SelectionBoxColor: a400f2
		OneShot: true

subjugation.dummy:
	Interactable:
		Bounds: 64, 64
	ScriptTriggers:
	RenderSprites:
		Image: empty
	WithSpriteBody:
	ClassicFacingBodyOrientation:
		QuantizedFacings: 1
	HiddenUnderFog:
		Type: GroundPosition
	HitShape:
	Immobile:
		OccupiesSpace: false
	PeriodicExplosion:
		Weapon: SubjugationEffect
	KillsSelf:
		Delay: 25

^Infantry:
	ExternalCondition@Subjugatable:
		Condition: subjugated
	WithColoredOverlay@Subjugated:
		RequiresCondition: subjugated
		Color: a400f233

^Building:
	ExternalCondition@Subjugatable:
		Condition: subjugated
	WithColoredOverlay@Subjugated:
		RequiresCondition: subjugated
		Color: a400f233

^Vehicle-NOUPG:
	ExternalCondition@Subjugatable:
		Condition: subjugated
	WithColoredOverlay@Subjugated:
		RequiresCondition: subjugated
		Color: a400f233

# Hunt() requires only 1 AttackBase
BATF.AI:
	-AttackFrontal:
